[package]
name = "inkstory"
version = "0.2.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "e1320b0a2e11afb59e4dee374883a2212d325699", features = ["json"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true

